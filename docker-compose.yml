# ════════════════════════════════════════════════════════════════════
#  ONE COMMAND, WHOLE STACK:   docker compose up
#
#    client   → http://localhost:8080   (nginx: SPA + /api proxy)
#    server   → http://localhost:3000   (Express API, node:sqlite)
#    indextts → internal :7861          (local voice cloning, no keys)
#
#  First boot of `indextts` downloads ~2-4 GB of model weights into the
#  `indextts-models` volume — watch it: docker compose logs -f indextts
#  Syntheses return "unavailable" until that download finishes.
#
#  Sidecar only (for pnpm dev against it): docker compose up indextts
# ════════════════════════════════════════════════════════════════════
services:
  indextts:
    build: ./sidecar
    container_name: tts-indextts
    ports:
      - "7861:7861"
    environment:
      INDEX_TTS_MODEL_DIR: /models/checkpoints
      INDEX_TTS_REFS_DIR: /models/refs
      HF_HOME: /models/hf
    volumes:
      - indextts-models:/models
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7861/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 60 # weight download can take a while
      start_period: 30s
    # ── NVIDIA GPU (optional, much faster) ──────────────────────────
    # Requires NVIDIA Container Toolkit; uncomment below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: tts-server
    ports:
      - "3000:3000"
    environment:
      TTS_PROVIDER: indextts
      INDEX_TTS_API_URL: http://indextts:7861
      # Local default — set a real secret for anything exposed!
      JWT_SECRET: ${JWT_SECRET:-change-me-before-any-real-deployment}
      CLIENT_ORIGIN: http://localhost:8080
      DB_PATH: /data/tts.sqlite
      UPLOADS_DIR: /data/uploads
    volumes:
      - server-data:/data
    depends_on:
      - indextts
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: tts-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  indextts-models:
  server-data:
