# Same-origin for the browser: static SPA + /api proxied to the API container.
# proxy_read_timeout is raised well above the IndexTTS CPU synthesis time
# so long POST /api/tts requests are never cut at nginx's 60 s default.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
